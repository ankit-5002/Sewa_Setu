{% extends "base.html" %}
{% block content %}
<h2>Application Status Portal</h2>
<p class="text-slate-600 text-sm mb-6">Track your application, download your acknowledgment, or manage connected services.</p>

<form method="post" class="space-y-4 max-w-md">
  <div>
    <label>Mobile Number</label>
    <input type="text" name="mobile" maxlength="10" placeholder="10-digit registered mobile">
  </div>
  <div>
    <label>Password</label>
    <input type="password" name="password" placeholder="Date of birth as DDMMYYYY">
    <p class="text-[12px] text-slate-500 mt-1">Default password is your Date of Birth in DDMMYYYY format.</p>
  </div>
  <div class="pt-2">
    <button class="btn w-full sm:w-auto" type="submit">Login</button>
  </div>
</form>

<div class="mt-6 pt-4 border-t border-slate-200/80">
  <p class="note"><a href="/status/reset" class="text-blue-600 hover:text-blue-800 underline font-medium">Forgot password?</a></p>
</div>
{% endblock %}
