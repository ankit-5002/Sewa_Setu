{% extends "base.html" %}
{% block content %}
<div class="p-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-950 my-4 max-w-lg">
  <div class="flex items-center gap-2 mb-2 text-rose-700">
    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    <span class="text-xs font-bold uppercase tracking-wider">OAuth Authorization Error</span>
  </div>
  <h2 class="font-purvsms text-rose-900 mb-2">{{ error }}</h2>
  <p class="text-rose-800 text-sm m-0">{{ detail }}</p>
</div>

<div class="mt-6 pt-4 border-t border-slate-200/80">
  <a href="/" class="btn" style="padding: 0.6rem 1.4rem;">Return to Home</a>
</div>
{% endblock %}
